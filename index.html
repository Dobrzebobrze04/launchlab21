<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch Lab 21 — Платформа инкубатора</title>
<style>
  :root{
    --bg: #0B0E14;
    --surface: #12161F;
    --surface-2: #1A2029;
    --border: #262D3B;
    --text: #F1F3F0;
    --muted: #8A93A6;
    --muted-2: #5C6478;
    --accent: #C6FF3D;
    --accent-dim: rgba(198,255,61,0.14);
    --warn: #FF6B5E;
    --radius: 2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  ::selection{ background:var(--accent); color:#0B0E14; }

  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  input, textarea{ font-family:inherit; }

  /* ---------- Layout shell ---------- */
  #app{ display:flex; min-height:100vh; }

  .rail{
    width:280px;
    flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:24px 20px;
    display:flex;
    flex-direction:column;
    gap:28px;
  }
  .rail-brand{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .rail-brand .mark{
    width:10px;height:10px;
    background:var(--accent);
    flex-shrink:0;
  }
  .rail-brand .name{
    font-size:15px;
    font-weight:700;
    letter-spacing:0.01em;
  }
  .rail-brand .name b{ color:var(--accent); font-weight:700; }

  .rail-section-label{
    font-size:11px;
    color:var(--muted-2);
    letter-spacing:0.06em;
    margin-bottom:10px;
  }

  .project-switcher{
    background:var(--surface-2);
    border:1px solid var(--border);
    padding:12px;
  }
  .project-switcher .p-name{ font-weight:700; font-size:14px; margin-bottom:2px; }
  .project-switcher .p-team{ font-size:12px; color:var(--muted); margin-bottom:10px;}
  .project-switcher button{
    width:100%;
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    font-size:12px;
    padding:6px 8px;
    transition:all .15s;
  }
  .project-switcher button:hover{ border-color:var(--accent); color:var(--text); }

  .stage-track{ display:flex; flex-direction:column; }
  .stage-item{
    position:relative;
    padding:12px 0 12px 28px;
    cursor:pointer;
    border-left:1px solid var(--border);
    margin-left:5px;
  }
  .stage-item:last-child{ border-left:1px solid transparent; }
  .stage-item .dot{
    position:absolute;
    left:-6px; top:14px;
    width:11px;height:11px;
    border-radius:50%;
    background:var(--bg);
    border:2px solid var(--muted-2);
  }
  .stage-item.done .dot{ background:var(--accent); border-color:var(--accent); }
  .stage-item.current .dot{ border-color:var(--accent); }
  .stage-item .stage-title{
    font-size:13px; font-weight:600; color:var(--muted);
  }
  .stage-item.current .stage-title, .stage-item.done .stage-title{ color:var(--text); }
  .stage-item .stage-sub{ font-size:11px; color:var(--muted-2); margin-top:2px; }
  .stage-item:hover .stage-title{ color:var(--text); }

  .rail-footer{ margin-top:auto; }
  .rail-footer button{
    width:100%;
    background:var(--accent);
    color:#0B0E14;
    border:none;
    font-weight:700;
    font-size:13px;
    padding:12px;
  }
  .rail-footer button:hover{ filter:brightness(1.08); }
  .rail-footer .all-projects{
    display:block;
    width:100%;
    background:transparent;
    color:var(--muted);
    border:1px solid var(--border);
    font-size:12px;
    padding:9px;
    margin-top:8px;
  }
  .rail-footer .all-projects:hover{ color:var(--text); border-color:var(--muted); }
  .rail-footer .reset-demo{
    display:block;
    width:100%;
    background:transparent;
    color:var(--muted-2);
    border:1px dashed var(--border);
    font-size:11px;
    padding:8px;
    margin-top:16px;
  }
  .rail-footer .reset-demo:hover{ color:var(--warn); border-color:var(--warn); }

  .mode-toggle{
    display:block;
    width:100%;
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    font-size:12px;
    font-weight:700;
    padding:10px;
  }
  .mode-toggle:hover{ border-color:var(--accent); color:var(--text); }

  .curator-nav-item{
    padding:10px 12px;
    border:1px solid var(--border);
    margin-bottom:8px;
    cursor:pointer;
    font-size:13px;
  }
  .curator-nav-item:hover{ border-color:var(--accent); }
  .curator-nav-item .cn-name{ font-weight:700; margin-bottom:2px; }
  .curator-nav-item .cn-progress{ font-size:11px; color:var(--muted-2); }

  .curator-table{ width:100%; border-collapse:collapse; }
  .curator-table th{
    text-align:left; font-size:11px; color:var(--muted-2); font-weight:700;
    padding:8px 12px; border-bottom:1px solid var(--border);
  }
  .curator-table td{
    padding:12px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle;
  }
  .curator-table tr{ cursor:pointer; }
  .curator-table tr:hover td{ background:var(--surface-2); }
  .status-dot{
    display:inline-block; width:9px; height:9px; border-radius:50%;
    background:var(--muted-2); margin-right:6px;
  }
  .status-dot.done{ background:var(--accent); }
  .status-dot.partial{ background:var(--warn); opacity:.6; }

  .comment-box{ margin-top:14px; }
  .comment-box textarea{
    width:100%; min-height:60px; background:var(--surface); border:1px solid var(--border);
    color:var(--text); padding:10px 12px; font-size:13px; resize:vertical;
  }
  .comment-box textarea::placeholder{ color:var(--muted-2); }
  .comment-box .btn-ghost{ margin-top:8px; padding:8px 16px; font-size:12px; }
  .comment-saved-note{ font-size:11px; color:var(--accent); margin-left:10px; }

  .badges-row{ font-size:17px; letter-spacing:4px; margin-top:8px; }
  .badges-row.empty{ font-size:11px; letter-spacing:0; color:var(--muted-2); }

  .history-box{ margin-top:28px; border-top:1px solid var(--border); padding-top:18px; }
  .history-box h4{ font-size:12px; color:var(--muted); margin:0 0 10px; font-weight:700; }
  .history-item{
    display:flex; align-items:center; justify-content:space-between;
    border:1px solid var(--border); padding:10px 12px; margin-bottom:8px; font-size:12px;
  }
  .history-item .h-time{ color:var(--muted); }
  .history-item button{
    background:transparent; border:1px solid var(--border); color:var(--muted);
    font-size:11px; padding:5px 10px;
  }
  .history-item button:hover{ color:var(--text); border-color:var(--accent); }

  .op-toolbar{ display:flex; gap:10px; margin-top:20px; }
  .toast{
    position:fixed; bottom:24px; right:24px; background:var(--accent); color:#0B0E14;
    font-size:13px; font-weight:700; padding:12px 18px; z-index:999;
  }

  main{ flex:1; padding:40px 56px; max-width:920px; }

  .eyebrow{ font-size:12px; color:var(--accent); font-weight:700; margin-bottom:10px; }
  h1{ font-size:32px; margin:0 0 8px; font-weight:700; letter-spacing:-0.01em; }
  .lede{ color:var(--muted); font-size:15px; max-width:60ch; margin-bottom:32px; }

  .progress-bar{
    height:4px; background:var(--surface-2); position:relative; margin:20px 0 36px;
    border:1px solid var(--border);
  }
  .progress-bar .fill{ height:100%; background:var(--accent); }

  /* Field form */
  .field{ margin-bottom:24px; }
  .field label{
    display:block; font-size:13px; font-weight:700; margin-bottom:8px;
  }
  .field textarea{
    width:100%;
    min-height:88px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    padding:12px 14px;
    font-size:14px;
    resize:vertical;
  }
  .field textarea:focus{ outline:none; border-color:var(--accent); }
  .field textarea::placeholder{ color:var(--muted-2); }

  .btn{
    background:var(--accent);
    color:#0B0E14;
    border:none;
    font-weight:700;
    font-size:13px;
    padding:12px 22px;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn-ghost{
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    font-size:13px;
    padding:11px 20px;
  }
  .btn-ghost:hover{ color:var(--text); border-color:var(--muted); }
  .actions{ display:flex; gap:10px; margin-top:8px; }

  /* Project list */
  .grid-projects{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .project-card{
    background:var(--surface);
    border:1px solid var(--border);
    padding:20px;
    cursor:pointer;
    transition:border-color .15s;
  }
  .project-card:hover{ border-color:var(--accent); }
  .project-card .pc-name{ font-weight:700; font-size:16px; margin-bottom:4px; }
  .project-card .pc-team{ font-size:12px; color:var(--muted); margin-bottom:14px; }
  .project-card .pc-progress-label{ font-size:11px; color:var(--muted-2); margin-bottom:6px; }
  .pc-bar{ height:3px; background:var(--surface-2); }
  .pc-bar .fill{ height:100%; background:var(--accent); }
  .new-project-card{
    border:1px dashed var(--border);
    display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:13px; font-weight:700;
    min-height:96px;
  }
  .new-project-card:hover{ border-color:var(--accent); color:var(--text); }

  /* New project form */
  .form-box{ max-width:480px; }
  .field input{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    padding:12px 14px;
    font-size:14px;
  }
  .field input:focus{ outline:none; border-color:var(--accent); }

  /* One-pager */
  .onepager{
    background:var(--surface);
    border:1px solid var(--border);
    padding:40px;
  }
  .op-header{ border-bottom:1px solid var(--border); padding-bottom:20px; margin-bottom:28px; }
  .op-tag{ font-size:11px; color:var(--accent); font-weight:700; margin-bottom:10px;}
  .op-title{ font-size:26px; font-weight:700; margin:0 0 6px; }
  .op-team{ color:var(--muted); font-size:13px; }
  .op-desc{ margin-top:14px; color:var(--text); font-size:14px; max-width:65ch; }
  .op-block{ margin-bottom:26px; }
  .op-block h3{ font-size:13px; text-transform:none; color:var(--muted); margin:0 0 4px; font-weight:700; }
  .op-block .op-sub{ font-size:11px; color:var(--muted-2); margin-bottom:12px; }
  .op-field{ margin-bottom:12px; }
  .op-field .q{ font-size:12px; color:var(--muted); margin-bottom:3px; }
  .op-field .a{ font-size:14px; }
  .op-empty{
    border:1px dashed var(--border);
    padding:14px; color:var(--muted-2); font-size:13px; font-style:italic;
  }

  @media print{
    .rail, .no-print{ display:none !important; }
    main{ padding:0; max-width:none; }
    body{ background:#fff; color:#111; }
    .onepager{ background:#fff; border:none; }
    .op-block h3, .op-title{ color:#111; }
    .op-field .a{ color:#111; }
  }

  @media (max-width: 760px){
    #app{ flex-direction:column; }
    .rail{ width:auto; border-right:none; border-bottom:1px solid var(--border); }
    main{ padding:28px 20px; }
    .grid-projects{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  // If opened via a shared "#public=" link, render a read-only public
  // one-pager view instead of the normal app (handled further below,
  // once MODULES and the rendering helpers are defined).
  var PUBLIC_PAYLOAD = null;
  if (location.hash && location.hash.indexOf("#public=") === 0){
    try{
      PUBLIC_PAYLOAD = JSON.parse(decodeURIComponent(location.hash.slice("#public=".length)));
    }catch(e){ PUBLIC_PAYLOAD = null; }
  }

  var STORAGE_KEY = "ll21_projects_v1";

  var MODULES = [
    {
      id: "custdev",
      title: "CustDev",
      subtitle: "Проблема и аудитория",
      fields: [
        { key: "problem",  label: "Какую проблему вы решаете?", placeholder: "Например: студентам сложно найти актуальные IT-вакансии в своём городе" },
        { key: "audience", label: "Кто страдает от этой проблемы?", placeholder: "Опишите портрет целевой аудитории" },
        { key: "current",  label: "Как они справляются с ней сейчас?", placeholder: "Какие обходные пути или альтернативы уже существуют" }
      ]
    },
    {
      id: "mvp",
      title: "MVP",
      subtitle: "Решение",
      fields: [
        { key: "solution", label: "Как ваш продукт решает эту проблему?", placeholder: "Кратко опишите механику решения" },
        { key: "features", label: "Какие ключевые функции реализованы в MVP?", placeholder: "Перечислите 2–4 главные функции" },
        { key: "done",     label: "Что уже сделано / протестировано?", placeholder: "Что вы успели построить и проверить на этот момент" }
      ]
    },
    {
      id: "model",
      title: "Модель",
      subtitle: "Рынок и монетизация",
      fields: [
        { key: "monetization", label: "Как вы зарабатываете на этом продукте?", placeholder: "Модель дохода: подписка, комиссия, реклама..." },
        { key: "clients",      label: "Кто ваши первые клиенты?", placeholder: "Кого вы приведёте первым — конкретно" },
        { key: "edge",         label: "В чём ваше отличие от конкурентов?", placeholder: "Почему выберут именно вас" }
      ]
    }
  ];

  var BADGE_ICONS = { custdev: "🧭", mvp: "🚀", model: "💰" };

  // ---------- Storage ----------
  function loadProjects(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    }catch(e){ return null; }
  }
  function saveProjects(projects){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
  }
  function emptyAnswers(){
    var a = {};
    MODULES.forEach(function(m){ a[m.id] = {}; });
    return a;
  }
  function seed(){
    var filled = emptyAnswers();
    filled.custdev = {
      problem: "Начинающим предпринимателям в Ташкенте сложно системно довести идею до презентации инвестору — нет структуры и шаблона.",
      audience: "Студенты и молодые специалисты 18–27 лет, которые хотят запустить свой первый проект.",
      current: "Собирают заметки в блокнотах и мессенджерах, презентацию делают в последнюю ночь перед питчем."
    };
    filled.mvp = {
      solution: "Платформа проводит команду по модулям программы и сама собирает результат в one-pager.",
      features: "Модули с заданиями, сохранение ответов, автосборка one-pager, прогресс по программе.",
      done: "Каркас модулей, форма ответов и генерация one-pager уже работают на демо-данных."
    };
    filled.model = {
      monetization: "Лицензия для образовательных центров и акселераторов, подписка помесячно.",
      clients: "School 21 и локальные IT-инкубаторы Ташкента.",
      edge: "Не просто трекер задач, а живой генератор питч-документа без ручной работы."
    };
    return [
      {
        id: "p_demo_filled",
        name: "TashTutor",
        team: "Команда: Азиз, Дилноза, Шерзод",
        description: "Маркетплейс частных репетиторов с проверкой квалификации.",
        createdAt: Date.now(),
        answers: filled,
        curatorComments: {},
        history: {}
      },
      {
        id: "p_demo_empty",
        name: "Новый проект",
        team: "Команда: —",
        description: "",
        createdAt: Date.now(),
        answers: emptyAnswers(),
        curatorComments: {},
        history: {}
      }
    ];
  }

  var state = {
    projects: loadProjects() || seed(),
    currentProjectId: null,
    view: "list",       // list | new | dashboard | module | onepager
    currentModuleId: null,
    mode: "participant", // participant | curator | gallery
    curatorProjectId: null,
    galleryProjectId: null
  };
  if (!loadProjects()) saveProjects(state.projects);
  state.projects.forEach(function(p){
    if (!p.curatorComments) p.curatorComments = {};
    if (!p.history) p.history = {};
  });
  state.currentProjectId = state.projects[0] ? state.projects[0].id : null;

  function persist(){ saveProjects(state.projects); }
  function getProject(id){
    return state.projects.filter(function(p){ return p.id === id; })[0];
  }
  function currentProject(){ return getProject(state.currentProjectId); }

  function moduleFillCount(project, module){
    var filled = 0;
    module.fields.forEach(function(f){
      if (project.answers[module.id] && project.answers[module.id][f.key] && project.answers[module.id][f.key].trim() !== "") filled++;
    });
    return filled;
  }
  function moduleStatus(project, module){
    var c = moduleFillCount(project, module);
    if (c === 0) return "empty";
    if (c === module.fields.length) return "done";
    return "partial";
  }
  function projectCompletedModules(project){
    return MODULES.filter(function(m){ return moduleStatus(project, m) === "done"; }).length;
  }
  function earnedBadges(project){
    return MODULES.filter(function(m){ return moduleStatus(project, m) === "done"; })
      .map(function(m){ return BADGE_ICONS[m.id]; });
  }
  function badgesHtml(project){
    var b = earnedBadges(project);
    if (!b.length) return '<div class="badges-row empty">Бейджей пока нет</div>';
    return '<div class="badges-row" title="Пройденные стадии">' + b.join(" ") + '</div>';
  }

  function esc(s){
    var d = document.createElement("div");
    d.textContent = s == null ? "" : s;
    return d.innerHTML;
  }

  function showToast(msg){
    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, 2400);
  }

  // ---------- Rendering ----------
  var root = document.getElementById("app");

  function render(){
    if (state.mode === "curator"){
      renderCuratorApp();
      return;
    }
    if (state.mode === "gallery"){
      renderGalleryApp();
      return;
    }
    var project = currentProject();
    var railHtml = renderRail(project);
    var mainHtml = "";
    if (state.view === "list" || !project) mainHtml = renderList();
    else if (state.view === "new") mainHtml = renderNewProject();
    else if (state.view === "dashboard") mainHtml = renderDashboard(project);
    else if (state.view === "module") mainHtml = renderModuleForm(project);
    else if (state.view === "onepager") mainHtml = renderOnePager(project);

    root.innerHTML = '<div class="rail">' + railHtml + '</div><main>' + mainHtml + '</main>';
    bindEvents();
  }

  function renderRail(project){
    var switcherHtml = "";
    if (project){
      switcherHtml =
        '<div>' +
          '<div class="rail-section-label">ПРОЕКТ</div>' +
          '<div class="project-switcher">' +
            '<div class="p-name">' + esc(project.name) + '</div>' +
            '<div class="p-team">' + esc(project.team) + '</div>' +
            '<button data-action="onepager">Смотреть one-pager</button>' +
          '</div>' +
        '</div>';
    }

    var trackHtml = "";
    if (project){
      var items = MODULES.map(function(m, idx){
        var status = moduleStatus(project, m);
        var cls = "stage-item";
        if (status === "done") cls += " done";
        if (state.view === "module" && state.currentModuleId === m.id) cls += " current";
        return (
          '<div class="' + cls + '" data-action="open-module" data-module="' + m.id + '">' +
            '<div class="dot"></div>' +
            '<div class="stage-title">' + (idx+1) + ". " + esc(m.title) + '</div>' +
            '<div class="stage-sub">' + esc(m.subtitle) + '</div>' +
          '</div>'
        );
      }).join("");
      trackHtml =
        '<div>' +
          '<div class="rail-section-label">СТАДИИ ПРОГРАММЫ</div>' +
          '<div class="stage-track">' + items + '</div>' +
        '</div>';
    }

    return switcherHtml + trackHtml +
      '<div class="rail-footer">' +
        '<button data-action="new-project">+ Новый проект</button>' +
        '<button class="all-projects" data-action="all-projects">Все проекты</button>' +
        '<button class="mode-toggle" data-action="enter-curator" style="margin-top:16px;">🛡 Режим куратора</button>' +
        '<button class="mode-toggle" data-action="enter-gallery" style="margin-top:8px;">🖼 Галерея Demo Day</button>' +
        '<button class="reset-demo" data-action="reset-demo">⟲ Сбросить демо-данные</button>' +
      '</div>';
  }

  function renderList(){
    var cards = state.projects.map(function(p){
      var done = projectCompletedModules(p);
      var pct = Math.round(done / MODULES.length * 100);
      return (
        '<div class="project-card" data-action="select-project" data-id="' + p.id + '">' +
          '<div class="pc-name">' + esc(p.name) + '</div>' +
          '<div class="pc-team">' + esc(p.team) + '</div>' +
          '<div class="pc-progress-label">' + done + ' / ' + MODULES.length + ' стадий пройдено</div>' +
          '<div class="pc-bar"><div class="fill" style="width:' + pct + '%"></div></div>' +
          badgesHtml(p) +
        '</div>'
      );
    }).join("");

    return (
      '<div class="eyebrow">Launch Lab 21</div>' +
      '<h1>Проекты инкубатора</h1>' +
      '<p class="lede">Выберите проект, чтобы продолжить прохождение программы, или создайте новый.</p>' +
      '<div class="grid-projects">' + cards +
        '<div class="project-card new-project-card" data-action="new-project">+ Новый проект</div>' +
      '</div>'
    );
  }

  function renderNewProject(){
    return (
      '<div class="eyebrow">Launch Lab 21</div>' +
      '<h1>Новый проект</h1>' +
      '<p class="lede">Заполните профиль — дальше пройдёте по стадиям программы.</p>' +
      '<div class="form-box">' +
        '<div class="field">' +
          '<label>Название проекта</label>' +
          '<input type="text" id="np-name" placeholder="Например: EcoRoute">' +
        '</div>' +
        '<div class="field">' +
          '<label>Состав команды</label>' +
          '<input type="text" id="np-team" placeholder="Имена участников через запятую">' +
        '</div>' +
        '<div class="field">' +
          '<label>Краткое описание</label>' +
          '<textarea id="np-desc" placeholder="Одно-два предложения о том, что вы делаете"></textarea>' +
        '</div>' +
        '<div class="actions">' +
          '<button class="btn" data-action="create-project">Создать проект</button>' +
          '<button class="btn-ghost" data-action="all-projects">Отмена</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderDashboard(project){
    var done = projectCompletedModules(project);
    var pct = Math.round(done / MODULES.length * 100);
    var cards = MODULES.map(function(m, idx){
      var status = moduleStatus(project, m);
      var label = status === "done" ? "Пройдено" : (status === "partial" ? "В процессе" : "Не начато");
      return (
        '<div class="project-card" data-action="open-module" data-module="' + m.id + '">' +
          '<div class="pc-progress-label">СТАДИЯ ' + (idx+1) + '</div>' +
          '<div class="pc-name">' + esc(m.title) + '</div>' +
          '<div class="pc-team">' + esc(m.subtitle) + ' — ' + label + '</div>' +
        '</div>'
      );
    }).join("");

    return (
      '<div class="eyebrow">' + esc(project.team) + '</div>' +
      '<h1>' + esc(project.name) + '</h1>' +
      '<p class="lede">' + (project.description ? esc(project.description) : "Описание проекта пока не добавлено.") + '</p>' +
      badgesHtml(project) +
      '<div class="progress-bar"><div class="fill" style="width:' + pct + '%"></div></div>' +
      '<div class="grid-projects">' + cards + '</div>' +
      '<div class="actions" style="margin-top:28px;">' +
        '<button class="btn" data-action="onepager">Смотреть one-pager</button>' +
      '</div>'
    );
  }

  function renderModuleForm(project){
    var module = MODULES.filter(function(m){ return m.id === state.currentModuleId; })[0];
    if (!module) return renderDashboard(project);
    var idx = MODULES.indexOf(module);
    var answers = project.answers[module.id] || {};

    var fieldsHtml = module.fields.map(function(f){
      var val = answers[f.key] || "";
      return (
        '<div class="field">' +
          '<label>' + esc(f.label) + '</label>' +
          '<textarea data-field="' + f.key + '" placeholder="' + esc(f.placeholder) + '">' + esc(val) + '</textarea>' +
        '</div>'
      );
    }).join("");

    var historyList = (project.history && project.history[module.id]) || [];
    var historyHtml = "";
    if (historyList.length){
      var items = historyList.map(function(snap, i){
        var d = new Date(snap.savedAt);
        var time = d.toLocaleDateString() + " " + d.toLocaleTimeString().slice(0,5);
        return (
          '<div class="history-item">' +
            '<span class="h-time">Версия от ' + time + '</span>' +
            '<button type="button" data-action="restore-version" data-module="' + module.id + '" data-index="' + i + '">Восстановить в форму</button>' +
          '</div>'
        );
      }).join("");
      historyHtml =
        '<div class="history-box">' +
          '<h4>История версий (' + historyList.length + ')</h4>' +
          items +
        '</div>';
    }

    return (
      '<div class="eyebrow">СТАДИЯ ' + (idx+1) + ' ИЗ ' + MODULES.length + '</div>' +
      '<h1>' + esc(module.title) + '</h1>' +
      '<p class="lede">' + esc(module.subtitle) + '</p>' +
      '<form id="module-form">' +
        fieldsHtml +
        '<div class="actions">' +
          '<button type="submit" class="btn">Сохранить ответ</button>' +
          '<button type="button" class="btn-ghost" data-action="back-dashboard">Назад</button>' +
        '</div>' +
      '</form>' +
      historyHtml
    );
  }

  function buildAnswerBlocksHtml(project){
    return MODULES.map(function(m){
      var status = moduleStatus(project, m);
      var answers = project.answers[m.id] || {};
      var inner;
      if (status === "empty"){
        inner = '<div class="op-empty">Раздел не заполнен</div>';
      } else {
        inner = m.fields.map(function(f){
          var val = answers[f.key];
          if (!val || val.trim() === "") return "";
          return (
            '<div class="op-field">' +
              '<div class="q">' + esc(f.label) + '</div>' +
              '<div class="a">' + esc(val) + '</div>' +
            '</div>'
          );
        }).join("");
        if (status === "partial"){
          inner += '<div class="op-empty">Часть полей ещё не заполнена</div>';
        }
      }
      return (
        '<div class="op-block">' +
          '<h3>' + esc(m.title) + ' ' + (status === "done" ? BADGE_ICONS[m.id] : "") + '</h3>' +
          '<div class="op-sub">' + esc(m.subtitle) + '</div>' +
          inner +
        '</div>'
      );
    }).join("");
  }

  function renderOnePager(project){
    var blocksHtml = buildAnswerBlocksHtml(project);

    return (
      '<div class="no-print"><button class="btn-ghost" data-action="back-dashboard" style="margin-bottom:20px;">← Назад к проекту</button></div>' +
      '<div class="onepager">' +
        '<div class="op-header">' +
          '<div class="op-tag">Launch Lab 21 · One-Pager</div>' +
          '<div class="op-title">' + esc(project.name) + '</div>' +
          '<div class="op-team">' + esc(project.team) + '</div>' +
          (project.description ? '<div class="op-desc">' + esc(project.description) + '</div>' : "") +
          badgesHtml(project) +
        '</div>' +
        blocksHtml +
      '</div>' +
      '<div class="op-toolbar no-print">' +
        '<button class="btn" data-action="print">Печать / PDF</button>' +
        '<button class="btn-ghost" data-action="copy-link" data-id="' + project.id + '">🔗 Публичная ссылка</button>' +
      '</div>'
    );
  }

  // ---------- Curator mode ----------
  function renderCuratorApp(){
    var railHtml =
      '<div>' +
        '<div class="rail-brand"><div class="mark"></div><div class="name">Launch <b>Lab 21</b></div></div>' +
      '</div>' +
      '<div>' +
        '<div class="rail-section-label">РЕЖИМ КУРАТОРА</div>' +
        '<p style="font-size:12px;color:var(--muted);margin:0;">Просмотр всех команд, их прогресса и ответов.</p>' +
      '</div>' +
      '<div class="rail-footer">' +
        '<button class="mode-toggle" data-action="exit-curator">← Вернуться к участнику</button>' +
      '</div>';

    var mainHtml;
    var project = state.curatorProjectId ? getProject(state.curatorProjectId) : null;
    if (project) mainHtml = renderCuratorDetail(project);
    else mainHtml = renderCuratorList();

    root.innerHTML = '<div class="rail">' + railHtml + '</div><main>' + mainHtml + '</main>';
    bindEvents();
  }

  function renderCuratorList(){
    var rows = state.projects.map(function(p){
      var cells = MODULES.map(function(m){
        var status = moduleStatus(p, m);
        return '<span class="status-dot ' + status + '" title="' + esc(m.title) + '"></span>';
      }).join("");
      var done = projectCompletedModules(p);
      return (
        '<tr data-action="curator-select-project" data-id="' + p.id + '">' +
          '<td><strong>' + esc(p.name) + '</strong></td>' +
          '<td>' + esc(p.team) + '</td>' +
          '<td>' + cells + '</td>' +
          '<td>' + done + ' / ' + MODULES.length + '</td>' +
        '</tr>'
      );
    }).join("");

    return (
      '<div class="eyebrow">Launch Lab 21 · Куратор</div>' +
      '<h1>Все команды</h1>' +
      '<p class="lede">Прогресс каждой команды по стадиям программы. Нажмите на строку, чтобы открыть ответы.</p>' +
      '<table class="curator-table">' +
        '<thead><tr><th>Проект</th><th>Команда</th><th>Стадии</th><th>Прогресс</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>'
    );
  }

  function renderCuratorDetail(project){
    var blocksHtml = MODULES.map(function(m){
      var status = moduleStatus(project, m);
      var answers = project.answers[m.id] || {};
      var inner;
      if (status === "empty"){
        inner = '<div class="op-empty">Раздел не заполнен</div>';
      } else {
        inner = m.fields.map(function(f){
          var val = answers[f.key];
          if (!val || val.trim() === "") return "";
          return (
            '<div class="op-field">' +
              '<div class="q">' + esc(f.label) + '</div>' +
              '<div class="a">' + esc(val) + '</div>' +
            '</div>'
          );
        }).join("");
      }
      var comment = (project.curatorComments && project.curatorComments[m.id]) || "";
      return (
        '<div class="op-block">' +
          '<h3>' + esc(m.title) + '</h3>' +
          '<div class="op-sub">' + esc(m.subtitle) + '</div>' +
          inner +
          '<div class="comment-box">' +
            '<label style="display:block;font-size:11px;color:var(--muted-2);margin-bottom:6px;">Комментарий куратора</label>' +
            '<textarea data-comment-module="' + m.id + '" placeholder="Оставьте обратную связь по этому модулю...">' + esc(comment) + '</textarea>' +
            '<button type="button" class="btn-ghost" data-action="save-comment" data-module="' + m.id + '">Сохранить комментарий</button>' +
            '<span class="comment-saved-note" data-saved-note="' + m.id + '" style="display:none;">Сохранено</span>' +
          '</div>' +
        '</div>'
      );
    }).join("");

    return (
      '<button class="btn-ghost" data-action="curator-back-list" style="margin-bottom:20px;">← Все команды</button>' +
      '<div class="eyebrow">' + esc(project.team) + '</div>' +
      '<h1>' + esc(project.name) + '</h1>' +
      '<p class="lede">' + (project.description ? esc(project.description) : "Описание проекта пока не добавлено.") + '</p>' +
      blocksHtml
    );
  }


  // ---------- Gallery mode (Demo Day) ----------
  function renderGalleryApp(){
    var railHtml =
      '<div>' +
        '<div class="rail-brand"><div class="mark"></div><div class="name">Launch <b>Lab 21</b></div></div>' +
      '</div>' +
      '<div>' +
        '<div class="rail-section-label">ГАЛЕРЕЯ DEMO DAY</div>' +
        '<p style="font-size:12px;color:var(--muted);margin:0;">Все one-pager\'ы команд для финального показа.</p>' +
      '</div>' +
      '<div class="rail-footer">' +
        '<button class="mode-toggle" data-action="exit-gallery">← Вернуться к участнику</button>' +
      '</div>';

    var project = state.galleryProjectId ? getProject(state.galleryProjectId) : null;
    var mainHtml = project ? renderGalleryDetail(project) : renderGalleryList();

    root.innerHTML = '<div class="rail">' + railHtml + '</div><main>' + mainHtml + '</main>';
    bindEvents();
  }

  function renderGalleryList(){
    var cards = state.projects.map(function(p){
      return (
        '<div class="project-card" data-action="gallery-select-project" data-id="' + p.id + '">' +
          '<div class="pc-name">' + esc(p.name) + '</div>' +
          '<div class="pc-team">' + esc(p.team) + '</div>' +
          '<p style="font-size:12px;color:var(--muted);margin:10px 0;">' + (p.description ? esc(p.description) : "Без описания") + '</p>' +
          badgesHtml(p) +
        '</div>'
      );
    }).join("");

    return (
      '<div class="eyebrow">Launch Lab 21 · Demo Day</div>' +
      '<h1>Общая галерея проектов</h1>' +
      '<p class="lede">Все команды инкубатора в одном месте — для финального показа.</p>' +
      '<div class="grid-projects">' + cards + '</div>'
    );
  }

  function renderGalleryDetail(project){
    var blocksHtml = buildAnswerBlocksHtml(project);
    return (
      '<button class="btn-ghost" data-action="gallery-back-list" style="margin-bottom:20px;">← Все проекты</button>' +
      '<div class="onepager">' +
        '<div class="op-header">' +
          '<div class="op-tag">Launch Lab 21 · One-Pager</div>' +
          '<div class="op-title">' + esc(project.name) + '</div>' +
          '<div class="op-team">' + esc(project.team) + '</div>' +
          (project.description ? '<div class="op-desc">' + esc(project.description) + '</div>' : "") +
          badgesHtml(project) +
        '</div>' +
        blocksHtml +
      '</div>'
    );
  }

  function bindEvents(){
    root.querySelectorAll("[data-action]").forEach(function(el){
      el.addEventListener("click", function(e){
        var action = el.getAttribute("data-action");
        if (action === "select-project"){
          state.currentProjectId = el.getAttribute("data-id");
          state.view = "dashboard";
          render();
        } else if (action === "new-project"){
          state.view = "new";
          render();
        } else if (action === "all-projects"){
          state.view = "list";
          render();
        } else if (action === "create-project"){
          var name = document.getElementById("np-name").value.trim() || "Без названия";
          var team = document.getElementById("np-team").value.trim() || "Команда: —";
          var desc = document.getElementById("np-desc").value.trim();
          var p = {
            id: "p_" + Date.now(),
            name: name,
            team: team,
            description: desc,
            createdAt: Date.now(),
            answers: emptyAnswers(),
            curatorComments: {},
            history: {}
          };
          state.projects.unshift(p);
          persist();
          state.currentProjectId = p.id;
          state.view = "dashboard";
          render();
        } else if (action === "open-module"){
          state.currentModuleId = el.getAttribute("data-module");
          state.view = "module";
          render();
        } else if (action === "back-dashboard"){
          state.view = "dashboard";
          render();
        } else if (action === "onepager"){
          state.view = "onepager";
          render();
        } else if (action === "print"){
          window.print();
        } else if (action === "reset-demo"){
          var ok = window.confirm("Стереть все проекты и вернуться к исходным демо-данным? Это действие необратимо.");
          if (ok){
            localStorage.removeItem(STORAGE_KEY);
            state.projects = seed();
            persist();
            state.currentProjectId = state.projects[0].id;
            state.currentModuleId = null;
            state.view = "list";
            render();
          }
        } else if (action === "enter-curator"){
          state.mode = "curator";
          state.curatorProjectId = null;
          render();
        } else if (action === "exit-curator"){
          state.mode = "participant";
          render();
        } else if (action === "curator-select-project"){
          state.curatorProjectId = el.getAttribute("data-id");
          render();
        } else if (action === "curator-back-list"){
          state.curatorProjectId = null;
          render();
        } else if (action === "restore-version"){
          var restoreModuleId = el.getAttribute("data-module");
          var restoreIdx = parseInt(el.getAttribute("data-index"), 10);
          var proj2 = currentProject();
          var snap = proj2.history[restoreModuleId][restoreIdx];
          if (snap){
            document.querySelectorAll("[data-field]").forEach(function(t){
              var key = t.getAttribute("data-field");
              if (snap.values.hasOwnProperty(key)) t.value = snap.values[key];
            });
          }
        } else if (action === "save-comment"){
          var moduleId = el.getAttribute("data-module");
          var box = el.closest(".comment-box");
          var text = box.querySelector("[data-comment-module='" + moduleId + "']").value;
          var proj = getProject(state.curatorProjectId);
          if (!proj.curatorComments) proj.curatorComments = {};
          proj.curatorComments[moduleId] = text;
          persist();
          var note = box.querySelector("[data-saved-note='" + moduleId + "']");
          if (note){
            note.style.display = "inline";
            setTimeout(function(){ note.style.display = "none"; }, 1800);
          }
        } else if (action === "enter-gallery"){
          state.mode = "gallery";
          state.galleryProjectId = null;
          render();
        } else if (action === "exit-gallery"){
          state.mode = "participant";
          render();
        } else if (action === "gallery-select-project"){
          state.galleryProjectId = el.getAttribute("data-id");
          render();
        } else if (action === "gallery-back-list"){
          state.galleryProjectId = null;
          render();
        } else if (action === "copy-link"){
          var linkProject = getProject(el.getAttribute("data-id"));
          var payload = {
            name: linkProject.name,
            team: linkProject.team,
            description: linkProject.description,
            answers: linkProject.answers
          };
          var base = location.href.split("#")[0];
          var url = base + "#public=" + encodeURIComponent(JSON.stringify(payload));
          if (navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(url).then(function(){
              showToast("Публичная ссылка скопирована");
            }).catch(function(){
              window.prompt("Скопируйте ссылку вручную:", url);
            });
          } else {
            window.prompt("Скопируйте ссылку вручную:", url);
          }
        }
      });
    });

    var form = document.getElementById("module-form");
    if (form){
      form.addEventListener("submit", function(e){
        e.preventDefault();
        var project = currentProject();
        var module = MODULES.filter(function(m){ return m.id === state.currentModuleId; })[0];
        var oldAnswers = project.answers[module.id] || {};
        var hadContent = module.fields.some(function(f){ return oldAnswers[f.key] && oldAnswers[f.key].trim() !== ""; });

        var newAnswers = {};
        form.querySelectorAll("[data-field]").forEach(function(t){
          newAnswers[t.getAttribute("data-field")] = t.value;
        });

        var changed = module.fields.some(function(f){ return (oldAnswers[f.key] || "") !== (newAnswers[f.key] || ""); });
        if (hadContent && changed){
          if (!project.history) project.history = {};
          if (!project.history[module.id]) project.history[module.id] = [];
          project.history[module.id].unshift({ savedAt: Date.now(), values: oldAnswers });
          project.history[module.id] = project.history[module.id].slice(0, 5);
        }

        project.answers[module.id] = newAnswers;
        persist();
        state.view = "dashboard";
        render();
      });
    }
  }

  function renderPublicView(payload){
    var blocksHtml = buildAnswerBlocksHtml(payload);
    root.innerHTML =
      '<main style="max-width:920px;margin:0 auto;padding:48px 24px;">' +
        '<p style="font-size:12px;color:var(--accent);font-weight:700;margin-bottom:20px;">🔗 ПУБЛИЧНАЯ ССЫЛКА · LAUNCH LAB 21</p>' +
        '<div class="onepager">' +
          '<div class="op-header">' +
            '<div class="op-tag">Launch Lab 21 · One-Pager</div>' +
            '<div class="op-title">' + esc(payload.name || "") + '</div>' +
            '<div class="op-team">' + esc(payload.team || "") + '</div>' +
            (payload.description ? '<div class="op-desc">' + esc(payload.description) + '</div>' : "") +
            badgesHtml(payload) +
          '</div>' +
          blocksHtml +
        '</div>' +
      '</main>';
  }

  if (PUBLIC_PAYLOAD){
    renderPublicView(PUBLIC_PAYLOAD);
  } else {
    render();
  }
})();
</script>
